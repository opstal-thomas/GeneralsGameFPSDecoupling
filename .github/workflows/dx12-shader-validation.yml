name: DX12 W3D Shader Validation

on:
  push:
    branches:
      - feature/w3d-renderer-backend-foundation
    paths:
      - 'Core/Libraries/Source/WWVegas/WW3D2/Backend/DX12/**'
      - 'scripts/check_dx12_launch_pe.py'
      - 'scripts/tests/test_dx12_launch_checkpoint.py'
      - 'scripts/tests/test_dx12_backend_selection.py'
      - 'scripts/tests/test_dx12_primary_window.py'
      - 'scripts/tests/test_dx12_pass_graph.py'
      - 'scripts/tests/test_dx12_geometry_buffers.py'
      - 'Documentation/DX12OnlyLaunchCheckpoint.md'
      - '.github/workflows/dx12-shader-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dx12-only-launch-contract:
    name: DX12-only Renderer contract and launch invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify exclusive DX12 Renderer definitions and backend selection
        run: python3 -m unittest discover -s scripts/tests -p 'test_dx12_backend_selection.py'
      - name: Verify game-HWND ownership and native frame contract
        run: python3 -m unittest discover -s scripts/tests -p 'test_dx12_primary_window.py'
      - name: Verify B10 launch, PE import-checker fixtures and DX8 exclusion
        run: python3 -m unittest discover -s scripts/tests -p 'test_dx12_launch_checkpoint.py'
      - name: Verify B05 W3D pass ordering and D3D12 barriers
        run: python3 -m unittest discover -s scripts/tests -p 'test_dx12_pass_graph.py'
      - name: Verify R01 W3D native geometry buffer lifecycle and mapping
        run: python3 -m unittest discover -s scripts/tests -p 'test_dx12_geometry_buffers.py'

  compile-shaders:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile W3D DX12 unlit shader for Shader Model 5.1
        shell: pwsh
        run: |
          $sdkBin = "${env:ProgramFiles(x86)}\Windows Kits\10\bin"
          if (-not (Test-Path $sdkBin)) { throw "Windows SDK bin directory not found: $sdkBin" }
          $compiler = Get-ChildItem -Path $sdkBin -Filter fxc.exe -Recurse -File |
            Sort-Object FullName -Descending | Select-Object -First 1
          if ($null -eq $compiler) { throw "Windows SDK fxc.exe shader compiler not found" }

          $shader = "Core/Libraries/Source/WWVegas/WW3D2/Backend/DX12/W3DLegacyUnlit.hlsl"
          $outVS = Join-Path $env:RUNNER_TEMP "W3DLegacyUnlit.vs.cso"
          $outPS = Join-Path $env:RUNNER_TEMP "W3DLegacyUnlit.ps.cso"

          & $compiler.FullName /nologo /T vs_5_1 /E W3D_VS /D W3D_STATIC_COMBINER_KEY=0x10101193u /Fo $outVS $shader
          if ($LASTEXITCODE -ne 0) { throw "DX12 vertex shader compilation failed" }
          & $compiler.FullName /nologo /T ps_5_1 /E W3D_PS /D W3D_STATIC_COMBINER_KEY=0x10101193u /Fo $outPS $shader
          if ($LASTEXITCODE -ne 0) { throw "DX12 pixel shader compilation failed" }

          if ((Get-Item $outVS).Length -eq 0 -or (Get-Item $outPS).Length -eq 0) {
            throw "DX12 shader compilation produced empty bytecode"
          }
          Write-Host "W3D DX12 reference VS and PS compiled as Shader Model 5.1"

  warp-render-probe:
    name: W3D DX12 WARP render and present
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build and execute DX12 WARP geometry smoke probe
        shell: pwsh
        run: |
          $source = "Core/Libraries/Source/WWVegas/WW3D2/Backend/DX12/Probe"
          $build = Join-Path $env:RUNNER_TEMP "w3d-dx12-warp-probe"
          cmake -S $source -B $build -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { throw "DX12 WARP probe configuration failed" }
          cmake --build $build --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "DX12 WARP probe compilation failed" }
          ctest --test-dir $build -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw "DX12 WARP GPU pixel verification failed" }

      - name: Build and execute DX12 WARP swapchain tests (Win32 and x64)
        shell: pwsh
        run: |
          $source = "Core/Libraries/Source/WWVegas/WW3D2/Backend/DX12/Presentation"
          $artifacts = Join-Path $env:RUNNER_TEMP "w3d-dx12-presentation-artifacts"
          New-Item -ItemType Directory -Path $artifacts -Force | Out-Null
          $launchArtifacts = Join-Path $env:RUNNER_TEMP "w3d-dx12-b10-launch-artifacts"
          New-Item -ItemType Directory -Path $launchArtifacts -Force | Out-Null
          foreach ($architecture in @("Win32", "x64")) {
            $build = Join-Path $env:RUNNER_TEMP "w3d-dx12-presentation-$architecture"
            cmake -S $source -B $build -G "Visual Studio 17 2022" -A $architecture
            if ($LASTEXITCODE -ne 0) { throw "DX12 swapchain $architecture configuration failed" }
            cmake --build $build --config Release --parallel 2
            if ($LASTEXITCODE -ne 0) { throw "DX12 swapchain $architecture compilation failed" }
            ctest --test-dir $build -C Release --output-on-failure
            if ($LASTEXITCODE -ne 0) { throw "DX12 swapchain $architecture rendering/present failed" }
            $checkpoint = Join-Path $build "Release/W3DDX12LaunchCheckpoint.exe"
            python scripts/check_dx12_launch_pe.py --exe $checkpoint
            if ($LASTEXITCODE -ne 0) { throw "DX12-only checkpoint imports forbidden D3D8 libraries or lacks D3D12" }
            Copy-Item -Path $checkpoint -Destination (Join-Path $launchArtifacts "W3DDX12LaunchCheckpoint-$architecture.exe") -ErrorAction Stop
            Copy-Item -Path (Join-Path $build "Release/W3DDX12PresentationSmoke.exe") -Destination (Join-Path $artifacts "W3DDX12PresentationSmoke-$architecture.exe") -ErrorAction Stop
          }
          Copy-Item -Path "Core/Libraries/Source/WWVegas/WW3D2/Backend/DX12/W3DLegacyUnlit.hlsl" -Destination (Join-Path $artifacts "W3DLegacyUnlit.hlsl") -ErrorAction Stop
          Copy-Item -Path "Core/Libraries/Source/WWVegas/WW3D2/Backend/DX12/W3DLegacyTextureCombiner.hlsli" -Destination (Join-Path $artifacts "W3DLegacyTextureCombiner.hlsli") -ErrorAction Stop
          Copy-Item -Path "Documentation/DX12OnlyLaunchCheckpoint.md" -Destination (Join-Path $launchArtifacts "README.md") -ErrorAction Stop
      - name: Upload DX12-only launch checkpoint executables
        uses: actions/upload-artifact@v4
        with:
          name: w3d-dx12-b10-launch-checkpoint
          path: ${{ runner.temp }}/w3d-dx12-b10-launch-artifacts/*
          if-no-files-found: error
          retention-days: 14
      - name: Upload standalone DX12 presentation smoke tests
        uses: actions/upload-artifact@v4
        with:
          name: w3d-dx12-presentation-smoke
          path: ${{ runner.temp }}/w3d-dx12-presentation-artifacts/*
          if-no-files-found: error
          retention-days: 14
