name: W3D Renderer Validation

on:
  push:
    branches:
      - 'feature/w3d-renderer-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: w3d-renderer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.game }} win32
    strategy:
      fail-fast: false
      matrix:
        game: [Generals, GeneralsMD]
    uses: ./.github/workflows/reusable-build-toolchain.yml
    with:
      game: ${{ matrix.game }}
      preset: win32
      tools: false
      extras: false
      tests: true
