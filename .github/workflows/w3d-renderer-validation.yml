name: W3D Renderer Validation

on:
  push:
    branches:
      - 'feature/w3d-renderer-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: w3d-renderer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dx8-boundary-audit:
    name: Full DX8 dependency inventory and boundary audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for immutable pre-B01 baseline.
      - name: Test dependency scanner
        run: python3 -m unittest discover -s scripts/tests -p 'test_dx8_dependency_inventory.py'
      - name: Validate exclusive Renderer backend contract and selection
        run: python3 -m unittest discover -s scripts/tests -p 'test_dx12_backend_selection.py'
      - name: Verify DX12 primary-game-window ownership integration
        run: python3 -m unittest discover -s scripts/tests -p 'test_dx12_primary_window.py'
      - name: Verify exclusive DX12-only developer launch wiring and PE audit fixtures
        run: python3 -m unittest discover -s scripts/tests -p 'test_dx12_launch_checkpoint.py'
      - name: Prevent direct DX8 call regressions
        run: python3 scripts/check_w3d_dx8_boundaries.py
      - name: Inventory DX8 symbols and block new runtime dependencies
        run: |
          python3 scripts/dx8_dependency_inventory.py --check \
            --json-out "$RUNNER_TEMP/dx8-inventory.json" \
            --markdown-out "$RUNNER_TEMP/dx8-inventory.md"
      - name: Add inventory to GitHub job summary
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/dx8-inventory.md" ]; then
            cat "$RUNNER_TEMP/dx8-inventory.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload complete DX8 dependency inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dx8-dependency-inventory
          path: |
            ${{ runner.temp }}/dx8-inventory.json
            ${{ runner.temp }}/dx8-inventory.md
          if-no-files-found: warn
          retention-days: 30

  build-and-test:
    needs: dx8-boundary-audit
    name: ${{ matrix.game }} win32
    strategy:
      fail-fast: false
      matrix:
        game: [Generals, GeneralsMD]
    uses: ./.github/workflows/reusable-build-toolchain.yml
    with:
      game: ${{ matrix.game }}
      preset: win32
      tools: false
      extras: false
      tests: true

  dx12-gameplay-preview-build:
    needs: dx8-boundary-audit
    name: ${{ matrix.game }} DX12 mesh preview Win32
    strategy:
      fail-fast: false
      matrix:
        game: [Generals, GeneralsMD]
    uses: ./.github/workflows/reusable-build-toolchain.yml
    with:
      game: ${{ matrix.game }}
      preset: win32
      tools: false
      extras: false
      tests: false
      dx12_preview: true

  # B02 is a build-only bootstrap: Renderer::Init rejects normal gameplay until
  # B03/B04 move DX12 presentation and the frame lifecycle onto the game's HWND.
  # Do not install or advertise these artifacts as playable executables.
  dx12-exclusive-backend-bootstrap:
    needs: dx8-boundary-audit
    name: ${{ matrix.game }} DX12 exclusive backend bootstrap (non-playable)
    strategy:
      fail-fast: false
      matrix:
        game: [Generals, GeneralsMD]
    uses: ./.github/workflows/reusable-build-toolchain.yml
    with:
      game: ${{ matrix.game }}
      preset: win32-dx12-bootstrap
      renderer_backend: DX12
      tools: false
      extras: false
      tests: false
      dx12_preview: false
